schema {
  mutation: RootMutationType
  query: RootQueryType
}

type SignInWithMagicLinkMetadata {
  token: String!
}

"The result of the :sign_in_with_magic_link mutation"
type SignInWithMagicLinkResult {
  "The successful result of the mutation"
  result: User

  "Any errors generated, if the mutation failed"
  errors: [MutationError!]!

  "Metadata produced by the mutation"
  metadata: SignInWithMagicLinkMetadata
}

input UserFilterEmail {
  isNil: Boolean
  eq: String
  notEq: String
  in: [String!]
  lessThan: String
  greaterThan: String
  lessThanOrEqual: String
  greaterThanOrEqual: String
  contains: String
  isDistinctFrom: String
  isNotDistinctFrom: String
  rangeAdjacent: String
  rangeContains: String
  rangeOverlaps: String
  stringEndsWith: String
  stringStartsWith: String
}

input UserFilterId {
  isNil: Boolean
  eq: ID
  notEq: ID
  in: [ID!]
  lessThan: ID
  greaterThan: ID
  lessThanOrEqual: ID
  greaterThanOrEqual: ID
  isDistinctFrom: ID
  isNotDistinctFrom: ID
  rangeAdjacent: ID
  rangeContains: String
  rangeOverlaps: ID
}

input UserFilterInput {
  and: [UserFilterInput!]
  or: [UserFilterInput!]
  not: [UserFilterInput!]
  id: UserFilterId
  email: UserFilterEmail
}

type User {
  id: ID!
  email: String!
}

"An error generated by a failed mutation"
type MutationError {
  "The human readable error message"
  message: String

  "A shorter error message, with vars not replaced"
  shortMessage: String

  "Replacements for the short message"
  vars: Json

  "An error code for the given error"
  code: String

  "The field or fields that produced the error"
  fields: [String!]

  "The path to the field that produced the error"
  path: [String!]
}

type RootQueryType {
  "The user identified by the request's bearer token, if any."
  currentUser(
    "A filter to limit the results"
    filter: UserFilterInput
  ): User
}

type RootMutationType {
  """
  Requests a magic-link sign-in token for the given email and emails it
  as a deep link to the mobile app. Always reports the same success
  result whether or not the email belongs to a registered user, so the
  response can never be used to enumerate accounts.
  """
  requestMagicLink(email: String!): Boolean!

  "Sign in or register a user with magic link."
  signInWithMagicLink(
    "The token from the magic link that was sent to the user"
    token: String!
  ): SignInWithMagicLinkResult!
}

"""
The `Json` scalar type represents arbitrary json string data, represented as UTF-8
character sequences. The Json type is most often used to represent a free-form
human-readable json string.
"""
scalar Json
